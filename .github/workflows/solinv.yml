# Fails a pull request or a push that removes an Anchor account check
# (has_one, seeds, constraint, signer, ...), with an annotation on the line.
# https://github.com/psyto/solinv
name: solinv diff

on:
  pull_request:
    paths:
      - programs/**
      - .github/workflows/solinv.yml
  push:
    branches: [main]
    paths:
      - programs/**
      - .github/workflows/solinv.yml

permissions:
  contents: read

jobs:
  account-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: psyto/solinv@eb75c260c1ff95ce18196ecde07a46779a142d42
        with:
          program-src: |
            programs/soldojo/src
